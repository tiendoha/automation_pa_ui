id: hosting
roles: { template: reference, ote: target, production: target }
pageType: service-category
severity: high
status: confirmed
internalLinkPolicy:
  maxLinks: 500
  unsafePathPatterns:
    - '(^|/)(signout|logout|delete|remove|upload|payment|checkout|cart|precart|submit)(/|$|\\?)'
urls:
  template: https://template.web30s.vn/pa_2024_v1/index.php?page=hosting
